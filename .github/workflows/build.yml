name: build

# Pushes to main and pull requests only run the tests. A v* tag builds the
# binaries, the multi-arch image and the GitHub release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  release:
    needs: test
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # previous tag, for the CLI change check
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The tok client only changes when these paths do; otherwise reuse the
      # previous release's binaries. TOK_VERSION names the version they report,
      # so tok update compares against it rather than the release tag.
      - name: tok client binaries
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$VERSION^" 2>/dev/null || true)
          if [ -n "$prev" ] && git diff --quiet "$prev" "$VERSION" -- cmd/tok skills/tok go.mod go.sum Makefile \
             && gh release download "$prev" -D dist -p 'tok-*' -p SKILL.md; then
            gh release download "$prev" -D dist -p TOK_VERSION || echo "$prev" > dist/TOK_VERSION
            echo "tok unchanged since $prev: reusing its $(cat dist/TOK_VERSION) binaries"
          else
            rm -rf dist
            make dist VERSION="$VERSION"
          fi
          ls -l dist

      - name: tokd binaries
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags="-s -w -X github.com/paidem/tokd/internal/server.Version=$VERSION" -o bin/tokd-linux-$arch ./cmd/tokd
          done

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # v1.2.3 -> :1.2.3, :1.2, :latest
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: |
            bin=./bin
            downloads=./dist
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - run: (cd dist && sha256sum * > SHA256SUMS)
      - run: gh release create "$VERSION" dist/* --generate-notes --verify-tag
